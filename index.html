<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modern Wonders</title>
<style>
:root{
  --bg:#07101a;
  --panel:#111b29;
  --text:#f7f8fb;
  --muted:#97a5b8;
  --gold:#f6b83f;
  --gold2:#ffd873;
  --line:rgba(255,255,255,.09)
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:var(--bg);
  color:var(--text)
}

button{font:inherit}

.screen{
  display:none;
  min-height:100vh
}

.screen.active{display:block}

.wrap{
  width:min(1500px,96vw);
  margin:auto;
  padding:18px
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px
}

.brand{
  font-weight:950;
  letter-spacing:.14em
}

.brand span{color:var(--gold)}

.muted{
  color:var(--muted);
  font-size:13px
}

.kicker{
  font-size:11px;
  font-weight:850;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#e7bd70
}

.panel{
  border:1px solid var(--line);
  border-radius:26px;
  background:linear-gradient(180deg,#172337,#0d1623);
  box-shadow:0 24px 70px rgba(0,0,0,.34)
}

.primary,
.secondary{
  border-radius:13px;
  padding:11px 15px;
  font-weight:850;
  cursor:pointer
}

.primary{
  border:0;
  background:linear-gradient(135deg,var(--gold2),#f0a51f);
  color:#281900
}

.secondary{
  border:1px solid var(--line);
  background:#111b29;
  color:#fff
}

/* MAP */

.mapbg{
  background:
    radial-gradient(circle at 76% 8%,#203a59 0,transparent 28%),
    linear-gradient(155deg,#07101b,#0d1b2f 60%,#07101b)
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:28px;
  margin:20px 0 24px
}

.hero h1{
  font-size:clamp(46px,7vw,86px);
  line-height:.87;
  margin:4px 0
}

.hero p{
  max-width:570px;
  color:#aab7c7
}

.world{
  position:relative;
  height:630px;
  overflow:hidden;
  border-radius:30px;
  border:1px solid var(--line);
  background:linear-gradient(#18304c,#0c1b2d)
}

.world:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.55;
  background:
    radial-gradient(ellipse at 28% 38%,#506e56 0 12%,transparent 13%),
    radial-gradient(ellipse at 48% 46%,#4b6851 0 12%,transparent 13%),
    radial-gradient(ellipse at 70% 57%,#4c6750 0 10%,transparent 11%)
}

.citypin{
  position:absolute;
  z-index:3;
  transform:translate(-50%,-50%);
  border:0;
  background:transparent;
  color:white;
  text-align:center
}

.citypin.open{cursor:pointer}

.citypin .dot{
  width:24px;
  height:24px;
  margin:auto;
  border-radius:50%;
  background:#52667b;
  border:5px solid rgba(255,255,255,.14)
}

.citypin.open .dot{
  background:var(--gold);
  box-shadow:
    0 0 0 8px rgba(244,185,66,.12),
    0 0 30px rgba(244,185,66,.5)
}

.citypin.locked{opacity:.34}

.citypin b,
.citypin small{display:block}

.citypin b{margin-top:7px}

.citypin small{color:#9caabc}

.citycard{
  position:absolute;
  z-index:4;
  left:5%;
  bottom:6%;
  width:min(425px,88%);
  padding:18px;
  border:1px solid var(--line);
  border-radius:21px;
  background:rgba(6,12,21,.84);
  backdrop-filter:blur(14px)
}

.citycard h2{
  margin:4px 0;
  font-size:30px
}

.citycard p{color:#aab6c5}

.bar{
  height:10px;
  border-radius:999px;
  overflow:hidden;
  background:#172333
}

.bar span{
  display:block;
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  transition:width .35s ease
}

/* LEVELS */

.levelwrap{
  width:min(1060px,94vw);
  margin:auto;
  padding:26px 0
}

.levels{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:14px
}

.levelcard{
  padding:17px;
  min-height:214px
}

.levelcard.locked{opacity:.38}

.levelcard h3{margin:8px 0}

.levelcard p{
  min-height:56px;
  font-size:13px;
  color:#aab6c6
}

.stars{
  margin:10px 0;
  color:var(--gold2);
  letter-spacing:4px;
  font-size:20px
}

.levelcard button{width:100%}

/* GAME */

.gamegrid{
  display:grid;
  grid-template-columns:minmax(590px,740px) minmax(455px,1fr);
  gap:18px
}

.left{padding:16px}

.hud{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-bottom:11px
}

.stat{
  padding:10px 12px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:14px;
  background:#09131f
}

.label{
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#91a1b5
}

.value{
  margin-top:3px;
  font-size:21px;
  font-weight:950
}

.goals{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:11px
}

.goal{
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:999px;
  background:#08111c;
  font-size:12px
}

.goal.done{opacity:.42}

/* MATCH 3 */

.boardbox{
  padding:11px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  background:
    radial-gradient(circle at 50% 0,rgba(77,140,210,.08),transparent 30%),
    #06101a;
  box-shadow:inset 0 0 28px rgba(33,85,130,.08)
}

.board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:7px;
  aspect-ratio:1
}

.tile{
  position:relative;
  border:0;
  border-radius:17px;
  cursor:pointer;
  overflow:hidden;
  display:grid;
  place-items:center;
  will-change:transform,opacity;
  box-shadow:
    inset 0 1px rgba(255,255,255,.32),
    inset 0 -10px 18px rgba(0,0,0,.14),
    0 8px 14px rgba(0,0,0,.32);
  transition:filter .12s ease
}

.tile:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.22),
      transparent 32%,
      rgba(0,0,0,.18)
    )
}

.tile:after{
  content:"";
  position:absolute;
  left:14%;
  right:14%;
  top:10%;
  height:12%;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  filter:blur(2px);
  pointer-events:none
}

.tile:hover{filter:brightness(1.1)}

.tile.selected{
  outline:4px solid #fff;
  outline-offset:-4px;
  filter:brightness(1.16)
}

.tile.pop{
  animation:pop .2s ease forwards
}

@keyframes pop{
  to{
    opacity:0;
    transform:scale(.1) rotate(18deg);
    filter:brightness(2.4)
  }
}

.ico{
  width:62%;
  height:62%;
  position:relative;
  pointer-events:none;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,.34))
}

.c0{background:linear-gradient(150deg,#e05b50,#8d2c29)}
.c1{background:linear-gradient(150deg,#e4b13b,#946411)}
.c2{background:linear-gradient(150deg,#56c9c4,#196d69)}
.c3{background:linear-gradient(150deg,#58a9f4,#28559c)}
.c4{background:linear-gradient(150deg,#a982e4,#59388f)}
.c5{background:linear-gradient(150deg,#db83a3,#88405b)}

.tile.striped .ico{
  filter:drop-shadow(0 0 8px #fff)
}

.tile.striped:before{
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.34)
}

.tile.striped:after{
  content:"↔";
  left:auto;
  right:7px;
  top:5px;
  height:auto;
  background:none;
  filter:none;
  font-size:19px;
  color:#fff;
  text-shadow:0 2px 5px #000
}

.tile.rainbow{
  background:
    conic-gradient(
      #e05b50,
      #e4b13b,
      #56c9c4,
      #58a9f4,
      #a982e4,
      #db83a3,
      #e05b50
    )
}

.tile.rainbow:after{
  content:"✦";
  left:auto;
  right:7px;
  top:5px;
  height:auto;
  background:none;
  filter:none;
  font-size:19px;
  color:#fff;
  text-shadow:0 2px 5px #000
}

/* RESOURCE ICONS */

.brick:before{
  content:"";
  position:absolute;
  inset:14% 8%;
  background:
    linear-gradient(#70241e 0 0) 0 0/45% 44%,
    linear-gradient(#70241e 0 0) 100% 0/45% 44%,
    linear-gradient(#70241e 0 0) 18% 100%/45% 44%,
    linear-gradient(#70241e 0 0) 100% 100%/34% 44%;
  background-repeat:no-repeat
}

.metal:before{
  content:"";
  position:absolute;
  inset:8% 23%;
  border:7px solid #e7edf2;
  border-top-color:#aab3bb;
  border-bottom-color:#7d8791;
  transform:skew(-8deg)
}

.glass:before{
  content:"";
  position:absolute;
  inset:8%;
  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.8),
      rgba(181,242,255,.18)
    );
  border:3px solid rgba(225,251,255,.78);
  clip-path:
    polygon(
      50% 0,
      100% 25%,
      86% 100%,
      14% 100%,
      0 25%
    )
}

.energy:before{
  content:"";
  position:absolute;
  left:33%;
  top:4%;
  width:35%;
  height:90%;
  background:#fff;
  clip-path:
    polygon(
      55% 0,
      0 56%,
      40% 56%,
      25% 100%,
      100% 39%,
      59% 39%
    )
}

.stone:before{
  content:"";
  position:absolute;
  inset:13% 8%;
  background:linear-gradient(145deg,#e0dce4,#85818e);
  clip-path:
    polygon(
      15% 0,
      88% 8%,
      100% 72%,
      65% 100%,
      8% 86%,
      0 25%
    )
}

.comp:before{
  content:"";
  position:absolute;
  inset:12%;
  border:6px solid #f5d6e1;
  border-radius:50%
}

.comp:after{
  content:"";
  position:absolute;
  left:44%;
  top:6%;
  width:12%;
  height:88%;
  border-radius:5px;
  background:#f5d6e1;
  transform:rotate(45deg)
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:10px;
  color:#93a1b5;
  font-size:12px
}

/* 2.5D PARIS */

.construction{
  min-height:760px;
  position:relative;
  overflow:hidden;
  padding:0;
  background:#0e1722
}

.sceneVisual{
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none
}

.sky2d{
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 78% 22%,
      rgba(255,230,178,.95) 0 3%,
      rgba(255,203,122,.18) 8%,
      transparent 23%
    ),
    linear-gradient(
      180deg,
      #3e5a76 0%,
      #70859b 34%,
      #ca9371 61%,
      #2b394b 83%,
      #111924 100%
    )
}

.cloud2d{
  position:absolute;
  width:210px;
  height:55px;
  border-radius:50%;
  background:rgba(255,255,255,.11);
  filter:blur(11px);
  animation:cloudDrift 30s linear infinite
}

.cloud2d.a{
  top:18%;
  left:-28%
}

.cloud2d.b{
  top:29%;
  left:-38%;
  animation-delay:10s;
  animation-duration:38s
}

@keyframes cloudDrift{
  to{left:118%}
}

.cityBack,
.cityMid,
.cityFront{
  position:absolute;
  left:0;
  right:0;
  pointer-events:none
}

.cityBack{
  bottom:23%;
  height:190px;
  opacity:.45;
  background:
    linear-gradient(
      90deg,
      transparent 0 2%,
      #55606b 2% 8%,
      transparent 8% 10%,
      #505b65 10% 18%,
      transparent 18% 21%,
      #5b6670 21% 29%,
      transparent 29% 32%,
      #4c5864 32% 42%,
      transparent 42% 44%,
      #56616a 44% 53%,
      transparent 53% 56%,
      #4d5964 56% 66%,
      transparent 66% 68%,
      #56616c 68% 78%,
      transparent 78% 81%,
      #4e5964 81% 92%,
      transparent 92%
    )
}

.cityMid{
  bottom:18%;
  height:165px;
  background:
    linear-gradient(
      90deg,
      transparent 0 2%,
      #2b3640 2% 9%,
      transparent 9% 12%,
      #25323c 12% 20%,
      transparent 20% 23%,
      #2e3943 23% 33%,
      transparent 33% 36%,
      #25313c 36% 47%,
      transparent 47% 50%,
      #2c3741 50% 61%,
      transparent 61% 64%,
      #27333d 64% 75%,
      transparent 75% 79%,
      #2d3741 79% 90%,
      transparent 90%
    )
}

.cityMid:after{
  content:"";
  position:absolute;
  inset:15% 0 0;
  opacity:.5;
  background-image:
    radial-gradient(
      circle,
      #f4c66c 0 2px,
      transparent 2.5px
    );
  background-size:46px 31px
}

.cityFront{
  bottom:15%;
  height:90px;
  background:
    linear-gradient(
      90deg,
      #1b252e 0 7%,
      transparent 7% 10%,
      #1e2932 10% 17%,
      transparent 17% 21%,
      #202a33 21% 31%,
      transparent 31% 35%,
      #19242e 35% 45%,
      transparent 45% 50%,
      #1e2933 50% 61%,
      transparent 61% 66%,
      #1b2630 66% 78%,
      transparent 78% 83%,
      #1f2a34 83% 100%
    )
}

.river2d{
  position:absolute;
  left:-8%;
  right:-8%;
  bottom:8%;
  height:13%;
  transform:skewY(-2deg);
  background:
    linear-gradient(
      #1e3446,
      #0e1b28
    );
  box-shadow:
    inset 0 14px 30px rgba(244,185,66,.04)
}

.river2d:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      175deg,
      transparent 0 9px,
      rgba(255,210,130,.12) 10px 12px,
      transparent 13px 27px
    );
  animation:water 7s linear infinite
}

@keyframes water{
  to{background-position:180px 0}
}

.ground2d{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:18%;
  background:
    linear-gradient(
      #3e342c,
      #17191d
    )
}

.ground2d:after{
  content:"";
  position:absolute;
  inset:12% 4%;
  background:
    repeating-linear-gradient(
      165deg,
      transparent 0 27px,
      rgba(255,255,255,.025) 28px 30px
    )
}

.scaffold2d{
  position:absolute;
  bottom:15%;
  width:96px;
  height:205px;
  opacity:.7;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 16px,
      #8c672f 17px 20px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 25px,
      #8c672f 26px 29px
    )
}

.scaffold2d:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      45deg,
      transparent 0 23px,
      rgba(166,118,49,.65) 24px 27px,
      transparent 28px 50px
    )
}

.scaffold2d.left{left:4%}

.scaffold2d.right{
  right:5%;
  height:175px
}

.crane2d{
  position:absolute;
  right:7%;
  bottom:16%;
  width:8px;
  height:340px;
  background:
    linear-gradient(
      90deg,
      #8d621e,
      #d3a142,
      #8c601d
    );
  box-shadow:0 8px 18px rgba(0,0,0,.24)
}

.crane2d:before{
  content:"";
  position:absolute;
  right:-3px;
  top:0;
  width:245px;
  height:9px;
  background:
    linear-gradient(
      #d5a243,
      #8e641d
    );
  transform-origin:right center;
  clip-path:
    polygon(
      0 28%,
      100% 0,
      100% 100%,
      0 72%
    )
}

.crane2d:after{
  content:"";
  position:absolute;
  right:-23px;
  top:-14px;
  width:44px;
  height:25px;
  border:4px solid #d4a042;
  background:#3d3427
}

.cable2d{
  position:absolute;
  right:calc(7% + 135px);
  top:31%;
  width:2px;
  height:105px;
  background:#4d4d4d;
  transform-origin:top
}

.hook2d{
  position:absolute;
  left:-5px;
  bottom:-9px;
  width:12px;
  height:12px;
  border:2px solid #777;
  border-top:0;
  border-radius:0 0 9px 9px
}

.piece2d{
  position:absolute;
  right:calc(7% + 75px);
  top:44%;
  width:120px;
  height:48px;
  opacity:.9;
  transform-origin:center
}

.worker2d{
  position:absolute;
  bottom:15%;
  width:17px;
  height:34px;
  border-radius:7px 7px 5px 5px;
  background:#293442;
  animation:workerMove 3s ease-in-out infinite alternate
}

.worker2d:before{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  left:2.5px;
  top:-10px;
  border-radius:50%;
  background:#d1a06e
}

.worker2d:after{
  content:"";
  position:absolute;
  width:22px;
  height:6px;
  left:-2px;
  top:-13px;
  border-radius:5px;
  background:#e5ae32
}

.worker2d.w1{left:17%}

.worker2d.w2{
  left:24%;
  animation-delay:.7s
}

.worker2d.w3{
  right:20%;
  animation-delay:1.2s
}

@keyframes workerMove{
  to{transform:translateX(9px)}
}

.materials2d{
  position:absolute;
  bottom:10%;
  height:38px;
  background:
    repeating-linear-gradient(
      0deg,
      #665541 0 7px,
      #342b22 8px 11px
    );
  box-shadow:0 10px 16px rgba(0,0,0,.3)
}

.materials2d.m1{
  left:7%;
  width:105px
}

.materials2d.m2{
  right:7%;
  width:125px
}

.sceneUI{
  position:relative;
  z-index:10;
  height:100%;
  padding:24px;
  display:flex;
  flex-direction:column;
  pointer-events:none
}

.sceneUI h1{
  margin:5px 0 4px;
  font-size:38px;
  text-shadow:0 3px 12px rgba(0,0,0,.45)
}

.scenesub{
  font-size:14px;
  color:#e0e5eb;
  text-shadow:0 2px 8px rgba(0,0,0,.5)
}

.towerzone{
  flex:1;
  min-height:500px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  position:relative
}

.eiffel{
  width:min(400px,79%);
  max-height:510px;
  overflow:visible;
  filter:drop-shadow(0 25px 18px rgba(0,0,0,.48))
}

.towerStage{
  opacity:.03;
  transition:
    opacity .5s ease,
    filter .5s ease
}

.towerStage.visible{opacity:1}

.towerStage.building{
  opacity:.7;
  filter:
    brightness(1.35)
    drop-shadow(0 0 12px rgba(255,191,74,.8))
}

.metalStroke{
  fill:none;
  stroke:#312f2b;
  stroke-width:8;
  stroke-linecap:round;
  stroke-linejoin:round
}

.metalLight{
  fill:none;
  stroke:#756c60;
  stroke-width:4;
  stroke-linecap:round
}

.lattice{
  fill:none;
  stroke:#514a42;
  stroke-width:3;
  opacity:.95
}

.platform{
  fill:#393632;
  stroke:#746b60;
  stroke-width:3
}

.dark{fill:#22231f}

.stagechip{
  position:absolute;
  bottom:7%;
  padding:7px 16px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(5,10,16,.84);
  backdrop-filter:blur(8px);
  color:#eacb8f;
  font-size:11px;
  letter-spacing:.15em;
  text-transform:uppercase
}

.stagedots{
  position:absolute;
  bottom:1.6%;
  left:50%;
  transform:translateX(-50%);
  width:52%;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.stagedots:before{
  content:"";
  position:absolute;
  left:14px;
  right:14px;
  top:50%;
  height:3px;
  background:#475463;
  transform:translateY(-50%)
}

.dotStage{
  position:relative;
  z-index:2;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#33475b;
  border:3px solid #1c2937
}

.dotStage.done{background:#9c7120}

.dotStage.active{
  background:var(--gold);
  box-shadow:
    0 0 0 4px #182432,

/* EFFECTS */

.spark{
  position:absolute;
  z-index:30;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#ffd05b;
  box-shadow:0 0 10px #ffd05b;
  animation:spark .65s ease-out forwards
}

@keyframes spark{
  to{
    transform:translate(var(--x),var(--y));
    opacity:0
  }
}

.flash{
  position:fixed;
  z-index:1000;
  width:16px;
  height:16px;
  border-radius:50%;
  pointer-events:none;
  background:#fff;
  box-shadow:0 0 22px 7px rgba(255,220,145,.7);
  animation:flash .4s ease-out forwards
}

@keyframes flash{
  to{
    transform:scale(5);
    opacity:0
  }
}

.toast{
  position:fixed;
  z-index:1200;
  top:25px;
  left:50%;
  transform:translate(-50%,-14px);
  opacity:0;
  padding:10px 16px;
  border-radius:13px;
  color:#fff;
  background:#08111b;
  border:1px solid rgba(255,255,255,.09);
  transition:.2s
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

.overlay{
  position:fixed;
  inset:0;
  z-index:1100;
  display:none;
  place-items:center;
  background:rgba(3,6,10,.78);
  backdrop-filter:blur(9px)
}
